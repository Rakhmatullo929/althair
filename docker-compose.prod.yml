x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: althair-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_NAME:?POSTGRES_NAME is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: althair-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *service-defaults
    build:
      context: ./backend
    container_name: althair-api
    environment: *backend-environment
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --capture-output
    expose:
      - "8000"
    volumes:
      - media-data:/application/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/health/ready',
          headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0],
          'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=5)
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s
    stop_grace_period: 45s
    networks:
      backend: {}
      proxy:
        aliases:
          - althair-api

  celery:
    <<: *service-defaults
    build:
      context: ./backend
    container_name: althair-celery
    entrypoint: []
    command:
      ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 60s
    networks:
      - backend

  voice-worker:
    <<: *service-defaults
    build:
      context: ./backend
    container_name: althair-voice-worker
    entrypoint: []
    command: ["python", "manage.py", "run_voice_gateway"]
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python manage.py shell -c "from django.core.cache import cache;
          assert cache.get('voice:worker:heartbeat')"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    stop_grace_period: 30s
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  media-data:

networks:
  backend:
    internal: true
  proxy:
    external: true
    name: rental_track_default
