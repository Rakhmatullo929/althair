name: althair

x-backend-environment: &backend-environment
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
  CLIENT_APP_URL: ${CLIENT_APP_URL:?CLIENT_APP_URL is required}
  BACKEND_DOMAIN: ${BACKEND_DOMAIN:?BACKEND_DOMAIN is required}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@althair.local}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.dummy.EmailBackend}
  ADMIN_URL: ${ADMIN_URL:-admin/}
  POSTGRES_NAME: ${POSTGRES_NAME:?POSTGRES_NAME is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required}
  EARLY_ACCESS_WEBHOOK_SECRET: ${EARLY_ACCESS_WEBHOOK_SECRET:?EARLY_ACCESS_WEBHOOK_SECRET is required}
  SECURE_SSL_REDIRECT: "true"
  TRUST_PROXY_HEADERS: "true"
  SECURE_HSTS_SECONDS: "31536000"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
  SECURE_HSTS_PRELOAD: "true"
  SENTRY_DSN: ${SENTRY_DSN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-30}
  OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
  AI_RUNTIME_PROVIDER: ${AI_RUNTIME_PROVIDER:-fake}
  AI_RUNTIME_ENABLE_REAL_OPENAI: ${AI_RUNTIME_ENABLE_REAL_OPENAI:-false}
  AI_RUNTIME_GLOBAL_KILL_SWITCH: ${AI_RUNTIME_GLOBAL_KILL_SWITCH:-false}
  AI_INTERNAL_TEST_AUTOPILOT: "false"
  AI_MANUAL_GENERATION_PER_MINUTE: ${AI_MANUAL_GENERATION_PER_MINUTE:-5}
  AI_MAX_TOOL_CALLS_PER_RUN: ${AI_MAX_TOOL_CALLS_PER_RUN:-8}
  WEB_CHAT_ENABLE_PUBLIC: ${WEB_CHAT_ENABLE_PUBLIC:-false}
  WEB_CHAT_GLOBAL_KILL_SWITCH: ${WEB_CHAT_GLOBAL_KILL_SWITCH:-false}
  WEB_CHAT_ALLOW_FAKE_AUTOPILOT: "false"
  WEB_CHAT_SESSION_SIGNING_KEY: ${WEB_CHAT_SESSION_SIGNING_KEY:?WEB_CHAT_SESSION_SIGNING_KEY is required}
  WEB_CHAT_WIDGET_BASE_URL: ${WEB_CHAT_WIDGET_BASE_URL:?WEB_CHAT_WIDGET_BASE_URL is required}
  WEB_CHAT_WIDGET_ORIGINS: ${WEB_CHAT_WIDGET_ORIGINS:?WEB_CHAT_WIDGET_ORIGINS is required}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
  OUTLOOK_WEBHOOK_SECRET: ${OUTLOOK_WEBHOOK_SECRET:-}
  EXPECTED_API_TOKEN_SHA256: ${EXPECTED_API_TOKEN_SHA256:-}

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: althair-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_NAME:?POSTGRES_NAME is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: althair-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *service-defaults
    build:
      context: ./backend
    container_name: althair-api
    environment: *backend-environment
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --capture-output
    expose:
      - "8000"
    volumes:
      - media-data:/application/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/health/ready',
          headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0],
          'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=5)
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s
    stop_grace_period: 45s
    networks:
      backend: {}
      proxy:
        aliases:
          - althair-api

  celery:
    <<: *service-defaults
    build:
      context: ./backend
    container_name: althair-celery
    entrypoint: []
    command:
      ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 60s
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  media-data:

networks:
  backend:
    internal: true
  proxy:
    external: true
    name: rental_track_default
