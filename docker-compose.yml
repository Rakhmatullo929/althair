name: aifo

x-backend-environment: &backend-environment
  DEBUG: "true"
  SECRET_KEY: ${SECRET_KEY:-django-insecure-local-development-only}
  ALLOWED_HOSTS: localhost,127.0.0.1,api
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
  CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
  CLIENT_APP_URL: http://localhost:3001
  ENABLE_CRM_TEST_CHANNEL: ${ENABLE_CRM_TEST_CHANNEL:-false}
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  POSTGRES_NAME: ${POSTGRES_NAME:-aifo}
  POSTGRES_USER: ${POSTGRES_USER:-aifo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
  EARLY_ACCESS_WEBHOOK_SECRET: ${EARLY_ACCESS_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_NAME:-aifo}
      POSTGRES_USER: ${POSTGRES_USER:-aifo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aifo} -d ${POSTGRES_NAME:-aifo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  celery:
    build: ./backend
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
