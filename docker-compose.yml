name: aifo

x-backend-environment: &backend-environment
  DEBUG: "true"
  SECRET_KEY: ${SECRET_KEY:-django-insecure-local-development-only}
  ALLOWED_HOSTS: localhost,127.0.0.1,api
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
  CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
  CLIENT_APP_URL: http://localhost:3001
  ENABLE_CRM_TEST_CHANNEL: ${ENABLE_CRM_TEST_CHANNEL:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-30}
  OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
  AI_RUNTIME_PROVIDER: ${AI_RUNTIME_PROVIDER:-fake}
  AI_RUNTIME_ENABLE_REAL_OPENAI: ${AI_RUNTIME_ENABLE_REAL_OPENAI:-false}
  AI_RUNTIME_GLOBAL_KILL_SWITCH: ${AI_RUNTIME_GLOBAL_KILL_SWITCH:-false}
  AI_INTERNAL_TEST_AUTOPILOT: ${AI_INTERNAL_TEST_AUTOPILOT:-false}
  AI_MANUAL_GENERATION_PER_MINUTE: ${AI_MANUAL_GENERATION_PER_MINUTE:-5}
  AI_MAX_TOOL_CALLS_PER_RUN: ${AI_MAX_TOOL_CALLS_PER_RUN:-8}
  WEB_CHAT_ENABLE_PUBLIC: ${WEB_CHAT_ENABLE_PUBLIC:-false}
  WEB_CHAT_GLOBAL_KILL_SWITCH: ${WEB_CHAT_GLOBAL_KILL_SWITCH:-false}
  WEB_CHAT_ALLOW_FAKE_AUTOPILOT: ${WEB_CHAT_ALLOW_FAKE_AUTOPILOT:-false}
  WEB_CHAT_SESSION_SIGNING_KEY: ${WEB_CHAT_SESSION_SIGNING_KEY:-}
  WEB_CHAT_WIDGET_BASE_URL: http://localhost:3001
  WEB_CHAT_WIDGET_ORIGINS: http://localhost:3001
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_INSTAGRAM_VERIFY_TOKEN: ${META_INSTAGRAM_VERIFY_TOKEN:-}
  META_INSTAGRAM_GRAPH_API_VERSION: ${META_INSTAGRAM_GRAPH_API_VERSION:-}
  META_INSTAGRAM_REDIRECT_URI: ${META_INSTAGRAM_REDIRECT_URI:-http://localhost:8000/api/v1/integrations/instagram/oauth/callback/}
  META_INSTAGRAM_ENABLE_LIVE: ${META_INSTAGRAM_ENABLE_LIVE:-false}
  META_INSTAGRAM_ENABLE_HUMAN_AGENT: ${META_INSTAGRAM_ENABLE_HUMAN_AGENT:-false}
  META_INSTAGRAM_FAKE_PROVIDER: ${META_INSTAGRAM_FAKE_PROVIDER:-true}
  TELEGRAM_ENABLE_LIVE: ${TELEGRAM_ENABLE_LIVE:-false}
  TELEGRAM_FAKE_PROVIDER: ${TELEGRAM_FAKE_PROVIDER:-true}
  TELEGRAM_MANAGER_BOT_TOKEN: ${TELEGRAM_MANAGER_BOT_TOKEN:-}
  TELEGRAM_MANAGER_BOT_USERNAME: ${TELEGRAM_MANAGER_BOT_USERNAME:-AlthairManagerBot}
  TELEGRAM_MANAGER_WEBHOOK_URL: ${TELEGRAM_MANAGER_WEBHOOK_URL:-http://localhost:8000/api/v1/webhooks/telegram/manager/}
  TELEGRAM_MANAGER_WEBHOOK_SECRET: ${TELEGRAM_MANAGER_WEBHOOK_SECRET:-test-only-development-placeholder}
  TELEGRAM_BOT_WEBHOOK_BASE_URL: ${TELEGRAM_BOT_WEBHOOK_BASE_URL:-http://localhost:8000/api/v1/webhooks/telegram/bots}
  GOOGLE_GMAIL_ENABLE_LIVE: ${GOOGLE_GMAIL_ENABLE_LIVE:-false}
  GOOGLE_GMAIL_FAKE_PROVIDER: ${GOOGLE_GMAIL_FAKE_PROVIDER:-true}
  GOOGLE_GMAIL_CLIENT_ID: ${GOOGLE_GMAIL_CLIENT_ID:-}
  GOOGLE_GMAIL_CLIENT_SECRET: ${GOOGLE_GMAIL_CLIENT_SECRET:-}
  GOOGLE_GMAIL_REDIRECT_URI: ${GOOGLE_GMAIL_REDIRECT_URI:-http://localhost:8000/api/v1/integrations/gmail/oauth/callback/}
  GOOGLE_GMAIL_PUBSUB_TOPIC: ${GOOGLE_GMAIL_PUBSUB_TOPIC:-projects/test-project/topics/gmail-notifications}
  GOOGLE_GMAIL_PUBSUB_SUBSCRIPTION: ${GOOGLE_GMAIL_PUBSUB_SUBSCRIPTION:-projects/test-project/subscriptions/gmail-push}
  GOOGLE_GMAIL_PUBSUB_AUDIENCE: ${GOOGLE_GMAIL_PUBSUB_AUDIENCE:-http://localhost:8000/api/v1/webhooks/google/gmail-pubsub/}
  GOOGLE_GMAIL_PUBSUB_SERVICE_ACCOUNT: ${GOOGLE_GMAIL_PUBSUB_SERVICE_ACCOUNT:-gmail-push@test-project.iam.gserviceaccount.com}
  GOOGLE_GMAIL_FAKE_PUBSUB_TOKEN: ${GOOGLE_GMAIL_FAKE_PUBSUB_TOKEN:-test-only-google-pubsub-oidc}
  GOOGLE_GMAIL_INITIAL_SYNC_DAYS: ${GOOGLE_GMAIL_INITIAL_SYNC_DAYS:-30}
  GOOGLE_GMAIL_FULL_SYNC_MAX_MESSAGES: ${GOOGLE_GMAIL_FULL_SYNC_MAX_MESSAGES:-100}
  GOOGLE_GMAIL_INCREMENTAL_MAX_MESSAGES: ${GOOGLE_GMAIL_INCREMENTAL_MAX_MESSAGES:-500}
  GOOGLE_GMAIL_WATCH_RENEWAL_DAYS: ${GOOGLE_GMAIL_WATCH_RENEWAL_DAYS:-2}
  GOOGLE_GMAIL_CIRCUIT_BREAKER_FAILURES: ${GOOGLE_GMAIL_CIRCUIT_BREAKER_FAILURES:-3}
  GOOGLE_GMAIL_CIRCUIT_BREAKER_MINUTES: ${GOOGLE_GMAIL_CIRCUIT_BREAKER_MINUTES:-15}
  GOOGLE_GMAIL_MAX_ATTACHMENT_BYTES: ${GOOGLE_GMAIL_MAX_ATTACHMENT_BYTES:-10485760}
  GOOGLE_GMAIL_RETENTION_BATCH_SIZE: ${GOOGLE_GMAIL_RETENTION_BATCH_SIZE:-200}
  SMS_PROVIDER: ${SMS_PROVIDER:-fake}
  SMS_ENABLE_LIVE: ${SMS_ENABLE_LIVE:-false}
  SMS_FAKE_PROVIDER: ${SMS_FAKE_PROVIDER:-true}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
  TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_PUBLIC_BASE_URL: ${TWILIO_PUBLIC_BASE_URL:-http://localhost:8000}
  SMS_DAILY_MESSAGE_LIMIT: ${SMS_DAILY_MESSAGE_LIMIT:-10000}
  SMS_DAILY_SEGMENT_LIMIT: ${SMS_DAILY_SEGMENT_LIMIT:-20000}
  SMS_ALLOWED_COUNTRY_CODES: ${SMS_ALLOWED_COUNTRY_CODES:-}
  SMS_BLOCKED_COUNTRY_CODES: ${SMS_BLOCKED_COUNTRY_CODES:-}
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  POSTGRES_NAME: ${POSTGRES_NAME:-aifo}
  POSTGRES_USER: ${POSTGRES_USER:-aifo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
  EARLY_ACCESS_WEBHOOK_SECRET: ${EARLY_ACCESS_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_NAME:-aifo}
      POSTGRES_USER: ${POSTGRES_USER:-aifo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aifo} -d ${POSTGRES_NAME:-aifo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  celery:
    build: ./backend
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
