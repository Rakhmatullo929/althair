services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_NAME:-aifo}
      POSTGRES_USER: ${POSTGRES_USER:-aifo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aifo} -d ${POSTGRES_NAME:-aifo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  celery:
    build: ./backend
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  voice-worker:
    build: ./backend
    entrypoint: []
    command: ["python", "manage.py", "run_voice_gateway"]
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python manage.py shell -c \"from django.core.cache import cache; assert cache.get('voice:worker:heartbeat')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
